name: Build

# 跨平台构建：Windows / Linux / macOS
#
# 产物：
#   - 三个平台的独立可执行文件
#   - 打 tag 时自动创建 Release 并附上全部产物
#
# 注意：Linux 上 eframe/glow 需要 X11 开发库；macOS 用系统自带的 Metal/OpenGL。

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # 关掉增量编译，CI 上缓存目录不保留，开着只是拖慢
  CARGO_INCREMENTAL: 0

jobs:
  # ---------------------------------------------------------------
  # 先跑测试：只有 core 的单元测试是跨平台的
  # （app 的测试需要 GUI 环境，CI 上跳过）
  # ---------------------------------------------------------------
  test:
    name: Test (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: test-core

      - name: Run core tests
        run: cargo test -p mcworld-core --verbose

  # ---------------------------------------------------------------
  # 三平台构建
  # ---------------------------------------------------------------
  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mcworld-app.exe
            out: MinecraftSaveManager-windows-x64.exe

          - name: Linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: mcworld-app
            out: MinecraftSaveManager-linux-x64

          - name: macOS-x64
            os: macos-14
            target: x86_64-apple-darwin
            artifact: mcworld-app
            out: MinecraftSaveManager-macos-x64

          - name: macOS-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: mcworld-app
            out: MinecraftSaveManager-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}

      # Linux 需要 X11 / OpenGL 头文件，eframe 的 glow 后端要用
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libxinerama-dev

      # 生成资源对象：图标 + 版本信息 + 清单。
      #
      # 不能靠提交一个固定的 .obj —— 版本号改了它不会跟着变，
      # Windows 属性页会显示旧版本；而缺 VERSIONINFO / MANIFEST 的 exe，
      # 在杀软眼里就是"来路不明的自制程序"，很容易被误报。
      - name: Generate resource object
        shell: bash
        run: node .ci/make_rsrc_obj.js crates/app/assets/icon.ico crates/app/assets/icon_obj.obj

      # 把资源对象链进 exe。
      #
      # 本机构建通过 `.cargo/config.local.toml` 的 link-arg 引入，但那个文件
      # 不进 Git，所以 CI 必须在这里显式加 —— 否则发布出来的 exe 没有图标。
      - name: Build
        shell: bash
        run: |
          CFG="--config target.${{ matrix.target }}.rustflags=[]"
          if [ "${{ runner.os }}" = "Windows" ]; then
            CFG="--config target.${{ matrix.target }}.rustflags=[\"-C\",\"link-arg=crates/app/assets/icon_obj.obj\"]"
          fi
          cargo build --release --target ${{ matrix.target }} --package mcworld-app $CFG

      # 校验资源是否齐全。
      #
      # 资源对象里带的是真正的 ADDR32NB 重定位，链接器会自己把
      # OffsetToData 填成正确的全局 RVA，**不需要链接后再改 PE**。
      # 所以这里只做断言：缺 .rsrc、缺版本信息、RVA 不对都直接让构建失败。
      - name: Verify Windows resources
        if: runner.os == 'Windows'
        shell: bash
        run: |
          EXE="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          node .ci/patch_rsrc_rva.js "$EXE"
          node .ci/check_icon.js "$EXE"
          node .ci/check_resources.js "$EXE"
          node .ci/check_version_info.js "$EXE"

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" \
             "dist/${{ matrix.out }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 打 tag 时自动发 Release
  # ---------------------------------------------------------------
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 需要仓库才能读到 annotated tag 的说明文字
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 发布说明 = annotated tag 的说明文字。
      #
      # 之前用的是 `generate_release_notes: true`，但它只会生成一行
      # "Full Changelog" 比较链接 —— 没有 PR、没有 issue 标签时它
      # 什么都写不出来，Release 页面等于没有更新日志。
      #
      # 现在改为直接取 tag 说明（`git tag -a -m "..."` 里写的内容），
      # 这样每次发布前写好的更新说明会原样出现在 Release 页面。
      - name: Build release notes from tag message
        run: |
          git tag -l --format=%(contents) "${GITHUB_REF_NAME}" > raw.md

          # 首行如果只是版本号本身就去掉；如果写的是正文就原样保留。
          if [ "$(head -1 raw.md)" = "${GITHUB_REF_NAME}" ]; then
            tail -n +2 raw.md > body.md
          else
            cp raw.md body.md
          fi

          # 去掉首尾空行（中间的空行保留，Markdown 靠它分段）
          awk 'NF==0 && !seen {next} {seen=1; buf[++n]=$0; if (NF) last=n}
               END {for (i=1;i<=last;i++) print buf[i]}' body.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "版本 ${GITHUB_REF_NAME}" > release_notes.md
          fi

          echo "----- release notes -----"
          cat release_notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release_notes.md
          draft: false
          prerelease: false
