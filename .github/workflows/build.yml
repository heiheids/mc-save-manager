name: Build

# 跨平台构建：Windows / Linux / macOS
#
# 产物：
#   - 三个平台的独立可执行文件
#   - 打 tag 时自动创建 Release 并附上全部产物
#
# 注意：Linux 上 eframe/glow 需要 X11 开发库；macOS 用系统自带的 Metal/OpenGL。

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # 关掉增量编译，CI 上缓存目录不保留，开着只是拖慢
  CARGO_INCREMENTAL: 0

jobs:
  # ---------------------------------------------------------------
  # 先跑测试：只有 core 的单元测试是跨平台的
  # （app 的测试需要 GUI 环境，CI 上跳过）
  # ---------------------------------------------------------------
  test:
    name: Test (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: test-core

      - name: Run core tests
        run: cargo test -p mcworld-core --verbose

  # ---------------------------------------------------------------
  # 三平台构建
  # ---------------------------------------------------------------
  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mcworld-app.exe
            out: MinecraftSaveManager-windows-x64.exe

          - name: Linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: mcworld-app
            out: MinecraftSaveManager-linux-x64

          - name: macOS-x64
            os: macos-14
            target: x86_64-apple-darwin
            artifact: mcworld-app
            out: MinecraftSaveManager-macos-x64

          - name: macOS-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: mcworld-app
            out: MinecraftSaveManager-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}

      # Linux 需要 X11 / OpenGL 头文件，eframe 的 glow 后端要用
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libxinerama-dev

      # Windows 需要把图标资源链进 exe。
      #
      # `icon_obj.obj` 是手工构造的 COFF 对象（含 `.rsrc` 节），已在仓库里。
      # 本机构建通过 `.cargo/config.local.toml` 的 link-arg 引入，但那个文件
      # 不进 Git，所以 CI 必须在这里显式加 —— 否则发布出来的 exe 没有图标。
      - name: Build
        shell: bash
        run: |
          CFG="--config target.${{ matrix.target }}.rustflags=[]"
          if [ "${{ runner.os }}" = "Windows" ]; then
            CFG="--config target.${{ matrix.target }}.rustflags=[\"-C\",\"link-arg=crates/app/assets/icon_obj.obj\"]"
          fi
          cargo build --release --target ${{ matrix.target }} --package mcworld-app $CFG

      # Windows 上补齐 exe 图标的资源 RVA
      # （COFF 对象里的 OffsetToData 只能写节内偏移，链接后要补成全局 RVA）
      - name: Patch icon RVA (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          if (-not (Test-Path ".ci/patch_rsrc_rva.js")) {
            throw "missing .ci/patch_rsrc_rva.js"
          }
          node ".ci/patch_rsrc_rva.js" $exe --write
          Write-Host "--- verify: no pending RVA fixes below means OK ---"
          node ".ci/patch_rsrc_rva.js" $exe
          Write-Host "--- icon check ---"
          node ".ci/check_icon.js" $exe

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" \
             "dist/${{ matrix.out }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 打 tag 时自动发 Release
  # ---------------------------------------------------------------
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
